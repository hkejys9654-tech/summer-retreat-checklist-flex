<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>하계수양회 준비물 체크리스트</title>
  <meta name="theme-color" content="#2f6df6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="하계수양회 준비물">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <style>
    :root {
      color-scheme: light;
      --ink: #151515;
      --muted: #6e6a60;
      --line: #e5ded2;
      --paper: #f4efe6;
      --surface: #ffffff;
      --surface-strong: #f8f4ec;
      --blue: #1f6f5b;
      --mint: #2f8f72;
      --yellow: #c6a15b;
      --coral: #b85c4a;
      --violet: #384150;
      --shadow: 0 16px 40px rgba(38, 34, 28, 0.12);
      --fast: 160ms ease;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background:
        linear-gradient(120deg, rgba(31, 111, 91, 0.10), transparent 34%),
        linear-gradient(240deg, rgba(198, 161, 91, 0.13), transparent 40%),
        var(--paper);
      overflow-x: hidden;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      letter-spacing: 0;
      overflow-x: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }

    .app {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      padding: 8px 0 18px;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 850;
    }

    .kicker::before {
      content: "";
      width: 18px;
      height: 2px;
      border-radius: 999px;
      background: var(--yellow);
    }

    h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(34px, 6vw, 64px);
      line-height: 0.95;
      letter-spacing: 0;
      word-break: keep-all;
      text-wrap: balance;
    }

    .title-line {
      display: block;
    }

    .subtitle {
      margin: 14px 0 0;
      max-width: 680px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.5;
    }

    .progress-panel {
      width: min(330px, 100%);
      padding: 18px;
      border: 1px solid rgba(23, 23, 23, 0.08);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .progress-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
    }

    .progress-count {
      font-size: 15px;
      color: var(--muted);
      font-weight: 700;
    }

    .progress-rate {
      font-size: 34px;
      font-weight: 900;
      line-height: 1;
      color: var(--blue);
    }

    .progress-track {
      position: relative;
      overflow: hidden;
      height: 12px;
      margin-top: 14px;
      border-radius: 999px;
      background: #e9edf4;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--yellow), var(--mint), var(--blue));
      transition: width 280ms ease;
    }

    .toolbar {
      position: sticky;
      top: 8px;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      margin: 8px 0 24px;
      padding: 12px;
      border: 1px solid rgba(23, 23, 23, 0.08);
      border-radius: 8px;
      background: rgba(255, 250, 242, 0.86);
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 24px rgba(22, 28, 45, 0.08);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .filter-btn,
    .action-btn {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      font-weight: 800;
      transition: transform var(--fast), border-color var(--fast), background var(--fast), color var(--fast), box-shadow var(--fast);
    }

    .filter-btn:hover,
    .action-btn:hover {
      transform: translateY(-2px);
      border-color: var(--blue);
      box-shadow: 0 10px 18px rgba(47, 109, 246, 0.14);
    }

    .filter-btn.is-active {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }

    .action-btn.is-active {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
      box-shadow: 0 8px 18px rgba(31, 111, 91, 0.18);
    }

    .action-btn:disabled {
      opacity: 0.45;
      cursor: default;
      transform: none;
      box-shadow: none;
    }

    .action-icon {
      flex: 0 0 auto;
      width: 18px;
      display: grid;
      place-items: center;
      font-size: 18px;
      line-height: 1;
    }

    .data-menu {
      position: relative;
      min-width: 0;
    }

    .data-menu > summary {
      width: 100%;
      max-width: 100%;
      list-style: none;
      overflow: hidden;
      -webkit-appearance: none;
      appearance: none;
    }

    .data-menu > summary::-webkit-details-marker {
      display: none;
    }

    .data-menu[open] > summary {
      border-color: var(--blue);
      color: var(--blue);
      box-shadow: 0 8px 18px rgba(31, 111, 91, 0.12);
    }

    .data-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .data-dot {
      flex: 0 0 3px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: currentColor;
    }

    .data-label {
      min-width: 0;
      line-height: 1;
    }

    .data-menu-popover {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 12;
      display: grid;
      width: 220px;
      gap: 7px;
      padding: 9px;
      border: 1px solid rgba(23, 23, 23, 0.1);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 18px 40px rgba(22, 28, 45, 0.16);
    }

    .data-action {
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-size: 13px;
      font-weight: 850;
      text-align: left;
    }

    .data-action:hover {
      border-color: rgba(31, 111, 91, 0.38);
      background: #f4faf7;
      color: var(--blue);
    }

    .data-action.is-danger {
      color: var(--coral);
    }

    .adder {
      display: grid;
      grid-template-columns: minmax(145px, 180px) 1fr auto;
      gap: 10px;
      margin: 10px 0 24px;
      padding: 12px;
      border: 1px dashed rgba(47, 109, 246, 0.35);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
    }

    .category-adder {
      grid-template-columns: 1fr auto;
    }

    .add-panel {
      margin: 0 0 24px;
    }

    .add-panel summary {
      list-style: none;
    }

    .add-panel summary::-webkit-details-marker {
      display: none;
    }

    .add-toggle {
      min-height: 44px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid rgba(47, 109, 246, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
      color: var(--blue);
      font-weight: 900;
      box-shadow: 0 8px 18px rgba(22, 28, 45, 0.06);
    }

    .add-toggle::before {
      content: "+";
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      line-height: 1;
    }

    .adder select,
    .adder input {
      min-height: 46px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      outline: none;
      transition: border-color var(--fast), box-shadow var(--fast);
    }

    .adder select {
      padding: 0 12px;
      font-weight: 800;
    }

    .adder input {
      padding: 0 14px;
      font-weight: 700;
    }

    .adder select:focus,
    .adder input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(47, 109, 246, 0.14);
    }

    .add-btn {
      min-height: 46px;
      padding: 0 18px;
      border: 0;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      font-weight: 900;
      transition: transform var(--fast), background var(--fast), box-shadow var(--fast);
    }

    .add-btn:hover {
      transform: translateY(-2px);
      background: var(--blue);
      box-shadow: 0 12px 24px rgba(47, 109, 246, 0.24);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      align-items: start;
    }

    .category {
      min-width: 0;
      padding: 16px;
      border: 1px solid rgba(23, 23, 23, 0.08);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 12px 28px rgba(22, 28, 45, 0.08);
      transition: transform var(--fast), box-shadow var(--fast), border-color var(--fast);
    }

    .category:hover {
      transform: translateY(-3px);
      border-color: rgba(47, 109, 246, 0.22);
      box-shadow: 0 18px 36px rgba(22, 28, 45, 0.14);
    }

    .category-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .category-body {
      margin-top: 12px;
    }

    .category.is-collapsed .category-body,
    .board.is-reordering .category-body {
      display: none;
    }

    .category-title {
      flex: 1 1 auto;
      min-width: 0;
      margin: 0;
      font-size: inherit;
      letter-spacing: 0;
    }

    .category-toggle {
      width: 100%;
      min-width: 0;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 10px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      text-align: left;
    }

    .category-toggle:hover .category-title-text {
      color: var(--blue);
    }

    .category-title-text {
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 20px;
      font-weight: 900;
      line-height: 1.2;
      transition: color var(--fast);
    }

    .category-mark {
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--surface-strong);
      color: var(--blue);
      font-size: 16px;
      font-weight: 900;
    }

    .category-count {
      flex: 0 0 auto;
      padding: 7px 10px;
      border-radius: 999px;
      background: #f0f3f7;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .category-chevron {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      color: var(--blue);
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
      transform: rotate(180deg);
      transition: transform var(--fast);
    }

    .category.is-collapsed .category-chevron {
      transform: rotate(0deg);
    }

    .category-tools {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .category-reorder-tools {
      display: none;
      flex: 0 0 auto;
      align-items: center;
      gap: 5px;
    }

    .board.is-reordering {
      grid-template-columns: 1fr;
    }

    .board.is-reordering .category {
      cursor: default;
    }

    .board.is-reordering .category-tools {
      display: none;
    }

    .board.is-reordering .category-reorder-tools {
      display: flex;
    }

    .board.is-reordering .category-toggle {
      pointer-events: none;
    }

    .category-move-btn,
    .category-drag-handle {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(23, 23, 23, 0.1);
      border-radius: 8px;
      background: #fff;
      color: var(--blue);
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
      transition: transform var(--fast), border-color var(--fast), background var(--fast), color var(--fast), box-shadow var(--fast);
    }

    .category-move-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .category-drag-handle {
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .category-drag-handle.is-pressing {
      border-color: rgba(31, 111, 91, 0.44);
      background: #eaf5ef;
      box-shadow: inset 0 0 0 2px rgba(31, 111, 91, 0.12);
      transform: scale(0.94);
    }

    .category-drag-handle.is-active {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
    }

    .category-drag-handle:active {
      cursor: grabbing;
    }

    .category.is-dragging {
      z-index: 2;
      border-color: rgba(31, 111, 91, 0.55);
      background: #f4faf7;
      box-shadow: 0 18px 40px rgba(31, 111, 91, 0.2);
      opacity: 0.72;
    }

    .category.just-moved {
      animation: categoryMoved 520ms ease;
    }

    @keyframes categoryMoved {
      0% { background: #e4f4ec; transform: translateY(-3px); }
      100% { background: rgba(255, 255, 255, 0.82); transform: translateY(0); }
    }

    .category-action {
      min-height: 30px;
      padding: 0 9px;
      border: 1px solid rgba(23, 23, 23, 0.08);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      transition: transform var(--fast), color var(--fast), border-color var(--fast), background var(--fast);
    }

    .category-action:hover {
      transform: translateY(-1px);
      border-color: rgba(31, 111, 91, 0.28);
      color: var(--blue);
    }

    .category-delete-btn:hover {
      border-color: rgba(184, 92, 74, 0.32);
      color: var(--coral);
    }

    .items {
      display: grid;
      gap: 9px;
    }

    .category-add-panel {
      margin-top: 10px;
    }

    .category-add-panel summary {
      list-style: none;
    }

    .category-add-panel summary::-webkit-details-marker {
      display: none;
    }

    .category-add-toggle {
      min-height: 38px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px dashed rgba(31, 111, 91, 0.28);
      border-radius: 8px;
      background: rgba(248, 244, 236, 0.62);
      color: var(--blue);
      font-size: 13px;
      font-weight: 900;
    }

    .category-add-toggle::before {
      content: "+";
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      line-height: 1;
    }

    .category-item-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
      gap: 8px;
      margin-top: 8px;
    }

    .category-item-form input {
      min-height: 42px;
      width: 100%;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      outline: none;
      font-weight: 800;
    }

    .category-item-form input:focus {
      border-color: rgba(31, 111, 91, 0.52);
      box-shadow: 0 0 0 4px rgba(31, 111, 91, 0.12);
    }

    .category-item-form button {
      min-height: 42px;
      padding: 0 14px;
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-weight: 900;
      white-space: nowrap;
    }

    .category-empty {
      margin: 4px 0 0;
      padding: 14px 10px;
      border: 1px dashed rgba(23, 23, 23, 0.12);
      border-radius: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      text-align: center;
    }

    .item {
      position: relative;
      min-height: 58px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 3px 0 rgba(23, 23, 23, 0.04);
      transition: transform var(--fast), border-color var(--fast), background var(--fast), color var(--fast), box-shadow var(--fast);
    }

    .item.just-added {
      animation: itemAdded 820ms ease;
    }

    @keyframes itemAdded {
      0% {
        border-color: rgba(31, 111, 91, 0.75);
        background: #dff1e8;
        box-shadow: 0 0 0 5px rgba(31, 111, 91, 0.12);
      }
      100% {
        border-color: var(--line);
        background: var(--surface);
        box-shadow: 0 3px 0 rgba(23, 23, 23, 0.04);
      }
    }

    .item-main {
      min-height: 58px;
      width: 100%;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      gap: 11px;
      align-items: center;
      padding: 10px 86px 10px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      text-align: left;
      -webkit-tap-highlight-color: transparent;
    }

    .item:hover {
      transform: translateY(-3px) scale(1.01);
      border-color: rgba(47, 109, 246, 0.62);
      box-shadow: 0 14px 26px rgba(47, 109, 246, 0.14);
    }

    .item:active {
      transform: translateY(0) scale(0.985);
    }

    .item-main:focus-visible,
    .edit-btn:focus-visible,
    .category-action:focus-visible,
    .delete-btn:focus-visible {
      outline: 3px solid rgba(47, 109, 246, 0.32);
      outline-offset: 2px;
    }

    .item.is-checked {
      border-color: rgba(25, 169, 116, 0.45);
      background: linear-gradient(90deg, rgba(25, 169, 116, 0.16), rgba(47, 109, 246, 0.10));
      box-shadow: 0 8px 18px rgba(25, 169, 116, 0.13);
    }

    .check {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      border: 2px solid #c5ced9;
      background: #fff;
      color: #fff;
      transition: transform var(--fast), border-color var(--fast), background var(--fast);
    }

    .check::before {
      content: "";
      width: 13px;
      height: 7px;
      border-left: 3px solid currentColor;
      border-bottom: 3px solid currentColor;
      transform: rotate(-45deg) translate(1px, -1px) scale(0);
      transition: transform 180ms ease;
    }

    .item.is-checked .check {
      border-color: var(--mint);
      background: var(--mint);
      transform: rotate(4deg) scale(1.08);
    }

    .item.is-checked .check::before {
      transform: rotate(-45deg) translate(1px, -1px) scale(1);
    }

    .item-name {
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 16px;
      font-weight: 850;
      line-height: 1.25;
    }

    .item.is-checked .item-name {
      color: #244235;
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      text-decoration-color: rgba(25, 169, 116, 0.48);
    }

    .item-note {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
    }

    .badge {
      min-width: 44px;
      padding: 6px 8px;
      border-radius: 999px;
      background: #f3f5f8;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      font-weight: 900;
      transition: background var(--fast), color var(--fast), transform var(--fast);
    }

    .item.is-checked .badge {
      background: var(--mint);
      color: #fff;
      transform: scale(1.04);
    }

    .item-actions {
      position: absolute;
      top: 50%;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%) scale(0.94);
      transition: opacity var(--fast), transform var(--fast);
    }

    .edit-btn,
    .delete-btn {
      width: 36px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(23, 23, 23, 0.08);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      color: var(--muted);
      font-size: 12px;
      font-weight: 950;
      line-height: 1;
      white-space: nowrap;
      transition: background var(--fast), color var(--fast), box-shadow var(--fast), border-color var(--fast);
    }

    .delete-btn {

      color: var(--muted);

      font-weight: 850;

      color: var(--ink);

      .category-title-text {

      }

      .items {

      .item {

    @media (prefers-reduced-motion: reduce) {

</head>
<body>
  <main class="app">

      <div class="toolbar-actions">

    const editTitle = document.getElementById("editTitle");
    const editCopy = document.getElementById("editCopy");
    const editNameField = document.getElementById("editNameField");
    const editNameInput = document.getElementById("editNameInput");
    const editNoteField = document.getElementById("editNoteField");
    const editNoteInput = document.getElementById("editNoteInput");
    const editSaveBtn = document.getElementById("editSaveBtn");
    const editCancelBtn = document.getElementById("editCancelBtn");
    let editorState = null;

    function loadSet(key) {
      try {
        return new Set(JSON.parse(localStorage.getItem(key) || "[]"));
      } catch {
        return new Set();
      }
    }

    function loadCustomItems() {
      try {
        return JSON.parse(localStorage.getItem(CUSTOM_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function loadCustomCategories() {
      try {
        return JSON.parse(localStorage.getItem(CUSTOM_CATEGORY_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function loadObject(key) {
      try {
        return JSON.parse(localStorage.getItem(key) || "{}");
      } catch {
        return {};
      }
    }

    function loadArray(key) {
      try {
        const value = JSON.parse(localStorage.getItem(key) || "[]");
        return Array.isArray(value) ? value : [];
      } catch {
        return [];
      }
    }

    function createAutomaticBackup() {
      if (localStorage.getItem(AUTO_BACKUP_KEY)) return;

      const data = {};
      DATA_KEYS.forEach((key) => {
        const value = localStorage.getItem(key);
        if (value !== null) data[key] = value;
      });

      localStorage.setItem(AUTO_BACKUP_KEY, JSON.stringify({
        app: "하계수양회 준비물 체크리스트",
        version: 1,
        createdAt: new Date().toISOString(),
        data
      }));
    }

    function saveChecked() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...checkedItems]));
    }

    function saveCustomItems() {
      localStorage.setItem(CUSTOM_KEY, JSON.stringify(customItems));
    }

    function saveCustomCategories() {
      localStorage.setItem(CUSTOM_CATEGORY_KEY, JSON.stringify(customCategories));
    }

    function saveDeletedItems() {
      localStorage.setItem(DELETED_KEY, JSON.stringify([...deletedItems]));
    }

    function saveCategoryEdits() {
      localStorage.setItem(CATEGORY_KEY, JSON.stringify(categoryEdits));
    }

    function saveItemEdits() {
      localStorage.setItem(ITEM_KEY, JSON.stringify(itemEdits));
    }

    function saveCategoryOrder() {
      localStorage.setItem(ORDER_KEY, JSON.stringify(categoryOrder));
    }

    function saveExpandedCategories() {
      localStorage.setItem(EXPANDED_KEY, JSON.stringify([...expandedCategories]));
    }

    function saveOpenAddPanels() {
      localStorage.setItem(ADD_PANEL_KEY, JSON.stringify([...openAddPanels]));
    }

    function activeCategories() {
      const available = [...categories, ...customCategories]
        .filter((category) => !categoryEdits[category.id]?.deleted);
      const order = new Map(categoryOrder.map((id, index) => [id, index]));

      return available
        .sort((a, b) => {
          const aIndex = order.has(a.id) ? order.get(a.id) : Number.MAX_SAFE_INTEGER;
          const bIndex = order.has(b.id) ? order.get(b.id) : Number.MAX_SAFE_INTEGER;
          return aIndex - bIndex;
        })
        .map((category, index) => ({
          ...category,
          mark: String(index + 1).padStart(2, "0"),
          title: categoryEdits[category.id]?.title || category.title
        }));
    }

    function applyItemEdit(item) {
      const edit = itemEdits[item.id] || {};
      return {
        ...item,
        name: edit.name || item.name,
        note: Object.prototype.hasOwnProperty.call(edit, "note") ? edit.note : item.note
      };
    }

    function allCategories() {
      const clone = activeCategories().map((category) => ({
        ...category,
        items: (category.items || [])
          .filter((item) => !deletedItems.has(item.id))
          .map(applyItemEdit)
      }));

      customItems.forEach((item) => {
        if (deletedItems.has(item.id)) return;
        if (categoryEdits[item.categoryId]?.deleted) return;

        const target = clone.find((category) => category.id === item.categoryId) || clone[clone.length - 1];
        if (target) target.items.push(applyItemEdit(item));
      });

      return clone;
    }

    function allItems() {
      return allCategories().flatMap((category) => category.items.map((item) => ({
        ...item,
        categoryId: category.id
      })));
    }

    function captureBoardFocus() {
      const active = document.activeElement;
      if (!active || !board.contains(active) || !active.matches(".category-item-input, .category-item-note-input")) {
        return null;
      }

      const form = active.closest(".category-item-form");
      return {
        categoryId: form?.dataset.categoryId,
        fieldClass: active.classList.contains("category-item-note-input")
          ? "category-item-note-input"
          : "category-item-input",
        selectionStart: active.selectionStart,
        selectionEnd: active.selectionEnd
      };
    }

    function restoreBoardFocus(state) {
      if (!state?.categoryId) return;
      const form = board.querySelector(`.category-item-form[data-category-id="${CSS.escape(state.categoryId)}"]`);
      const input = form?.querySelector(`.${state.fieldClass}`);
      if (!input) return;

      input.focus({ preventScroll: true });
      if (typeof state.selectionStart === "number") {
        input.setSelectionRange(state.selectionStart, state.selectionEnd);
      }
    }

    function render(options = {}) {
      const previousScrollY = window.scrollY;
      const capturedFocus = captureBoardFocus();
      const previousAnchorTop = options.anchorCategoryId
        ? board.querySelector(`[data-category="${CSS.escape(options.anchorCategoryId)}"]`)?.getBoundingClientRect().top
        : null;
      const categoryList = allCategories();

      board.classList.toggle("is-reordering", isReorderMode);
      board.innerHTML = categoryList.map((category, categoryIndex) => {
        const isExpanded = expandedCategories.has(category.id);
        const checkedCount = category.items.filter((item) => checkedItems.has(item.id)).length;
        const categoryTitle = escapeHtml(category.title);
        const draft = itemDrafts[category.id] || { name: "", note: "" };
        const itemButtons = category.items.map((item) => {
          const isChecked = checkedItems.has(item.id);
          const hidden = currentFilter === "done" && !isChecked || currentFilter === "todo" && isChecked;
          const note = item.note ? `<span class="item-note">${escapeHtml(item.note)}</span>` : "";
          const deleteLabel = `${item.name} 삭제`;
          const editLabel = `${item.name} 수정`;

          return `
            <div
              class="item ${isChecked ? "is-checked" : ""} ${hidden ? "is-hidden" : ""}"
              data-id="${item.id}"
            >
              <button
                class="item-main"
                type="button"
                data-id="${item.id}"
                aria-pressed="${isChecked}"
              >
                <span class="check" aria-hidden="true"></span>
                <span class="item-name">${escapeHtml(item.name)}${note}</span>
                <span class="badge">${isChecked ? "완료" : "대기"}</span>
              </button>
              <span class="item-actions">
                <button
                  class="edit-btn"
                  type="button"
                  data-id="${item.id}"
                  aria-label="${escapeHtml(editLabel)}"
                  title="수정"
                >수정</button>
                <button
                  class="delete-btn"
                  type="button"
                  data-id="${item.id}"
                  aria-label="${escapeHtml(deleteLabel)}"
                  title="삭제"
                >&times;</button>
              </span>
            </div>
          `;
        }).join("");
        const emptyItems = itemButtons ? "" : `<p class="category-empty">아직 항목이 없습니다.</p>`;

        return `
          <article class="category ${isExpanded ? "" : "is-collapsed"}" data-category="${category.id}">
            <div class="category-head">
              <h2 class="category-title">
                <button
                  class="category-toggle"
                  type="button"
                  data-category-id="${category.id}"
                  aria-expanded="${isReorderMode ? false : isExpanded}"
                  aria-label="${categoryTitle} ${isExpanded ? "접기" : "펼치기"}"
                  ${isReorderMode ? "tabindex=\"-1\" aria-disabled=\"true\"" : ""}
                >
                  <span class="category-mark">${category.mark}</span>
                  <span class="category-title-text">${categoryTitle}</span>
                  <span class="category-count">${checkedCount}/${category.items.length}</span>
                  <span class="category-chevron" aria-hidden="true">⌄</span>
                </button>
              </h2>
              <div class="category-tools">
                <button class="category-action category-edit-btn" type="button" data-category-id="${category.id}">수정</button>
                <button class="category-action category-delete-btn" type="button" data-category-id="${category.id}">삭제</button>
              </div>
              <div class="category-reorder-tools">
                <button class="category-move-btn category-move-up" type="button" data-category-id="${category.id}" aria-label="${categoryTitle} 위로 이동" title="위로 이동" ${categoryIndex === 0 ? "disabled" : ""}>↑</button>
                <button class="category-move-btn category-move-down" type="button" data-category-id="${category.id}" aria-label="${categoryTitle} 아래로 이동" title="아래로 이동" ${categoryIndex === categoryList.length - 1 ? "disabled" : ""}>↓</button>
                <button class="category-drag-handle" type="button" data-category-id="${category.id}" aria-label="${categoryTitle} 길게 눌러 순서 변경" title="길게 눌러 이동">⠿</button>
              </div>
            </div>
            <div class="category-body">
              <div class="items">${itemButtons}${emptyItems}</div>
              <details class="category-add-panel" ${openAddPanels.has(category.id) ? "open" : ""}>
                <summary class="category-add-toggle" data-category-id="${category.id}">${categoryTitle}에 항목 추가</summary>
                <form class="category-item-form" data-category-id="${category.id}">
                  <input class="category-item-input" type="text" autocomplete="off" placeholder="준비물 이름" aria-label="${categoryTitle}에 준비물 추가" value="${escapeHtml(draft.name || "")}">
                  <input class="category-item-note-input" type="text" autocomplete="off" placeholder="설명/메모 선택" aria-label="${categoryTitle} 준비물 설명" value="${escapeHtml(draft.note || "")}">
                  <button type="submit">추가</button>
                </form>
              </details>
            </div>
          </article>
        `;
      }).join("");

      updateProgress();
      updateEmptyState();
      updateToggleAllButton();

      if (options.anchorCategoryId && previousAnchorTop !== null) {
        const freshAnchor = board.querySelector(`[data-category="${CSS.escape(options.anchorCategoryId)}"]`);
        if (freshAnchor) window.scrollBy(0, freshAnchor.getBoundingClientRect().top - previousAnchorTop);
      } else if (options.preserveScroll !== false) {
        window.scrollTo(0, previousScrollY);
      }

      if (options.focusCategoryId) {
        const input = board.querySelector(`.category-item-form[data-category-id="${CSS.escape(options.focusCategoryId)}"] .category-item-input`);
        if (input) input.focus({ preventScroll: true });
      } else {
        restoreBoardFocus(capturedFocus);
      }

      if (options.highlightItemId) {
        const added = board.querySelector(`.item[data-id="${CSS.escape(options.highlightItemId)}"]`);
        if (added) {
          added.classList.add("just-added");
          window.setTimeout(() => added.classList.remove("just-added"), 850);
        }
      }
    }

    function updateProgress() {
      const total = allItems().length;
      const done = allItems().filter((item) => checkedItems.has(item.id)).length;
      const percent = total ? Math.round(done / total * 100) : 0;

      progressCount.textContent = `${done} / ${total} 완료`;
      progressRate.textContent = `${percent}%`;
      progressFill.style.width = `${percent}%`;
    }

    function updateEmptyState() {
      const visibleItems = board.querySelectorAll(".item:not(.is-hidden)").length;
      const visibleCategories = board.querySelectorAll(".category").length;
      emptyState.classList.toggle("is-visible", visibleItems === 0 && visibleCategories === 0);
    }

    function updateToggleAllButton() {
      const categoryIds = allCategories().map((category) => category.id);
      const allExpanded = categoryIds.length > 0 && categoryIds.every((id) => expandedCategories.has(id));
      toggleAllLabel.textContent = allExpanded ? "전체 접기" : "전체 펼치기";
      toggleAllBtn.querySelector(".action-icon").textContent = allExpanded ? "⌃" : "⌄";
      toggleAllBtn.setAttribute("aria-label", allExpanded ? "대분류 전체 접기" : "대분류 전체 펼치기");
    }

    function toggleAllCategories() {
      const categoryIds = allCategories().map((category) => category.id);
      const allExpanded = categoryIds.length > 0 && categoryIds.every((id) => expandedCategories.has(id));

      if (allExpanded) {
        categoryIds.forEach((id) => expandedCategories.delete(id));
      } else {
        categoryIds.forEach((id) => expandedCategories.add(id));
      }

      saveExpandedCategories();
      render();
    }

    function toggleCategory(button) {
      if (isReorderMode) return;
      const categoryId = button.dataset.categoryId;
      const category = button.closest(".category");
      const willExpand = !expandedCategories.has(categoryId);

      if (willExpand) {
        expandedCategories.add(categoryId);
      } else {
        expandedCategories.delete(categoryId);
      }
      saveExpandedCategories();

      category.classList.toggle("is-collapsed", !willExpand);
      button.setAttribute("aria-expanded", String(willExpand));
      const title = category.querySelector(".category-title-text")?.textContent || "대분류";
      button.setAttribute("aria-label", `${title} ${willExpand ? "접기" : "펼치기"}`);
      updateToggleAllButton();
    }

    function updateCategoryCount(categoryId) {
      const category = findCategory(categoryId);
      const card = board.querySelector(`[data-category="${CSS.escape(categoryId)}"]`);
      if (!category || !card) return;
      const checkedCount = category.items.filter((item) => checkedItems.has(item.id)).length;
      const count = card.querySelector(".category-count");
      if (count) count.textContent = `${checkedCount}/${category.items.length}`;
    }

    function toggleItem(button) {
      const id = button.dataset.id;
      const becameChecked = !checkedItems.has(id);

      if (becameChecked) {
        checkedItems.add(id);
      } else {
        checkedItems.delete(id);
      }

      saveChecked();
      const item = button.closest(".item");
      item.classList.toggle("is-checked", becameChecked);
      button.setAttribute("aria-pressed", String(becameChecked));
      const badge = item.querySelector(".badge");
      if (badge) badge.textContent = becameChecked ? "완료" : "대기";
      const hidden = currentFilter === "done" && !becameChecked || currentFilter === "todo" && becameChecked;
      item.classList.toggle("is-hidden", hidden);

      const categoryId = item.closest(".category")?.dataset.category;
      if (categoryId) updateCategoryCount(categoryId);
      updateProgress();
      updateEmptyState();

      if (becameChecked) showBurst(button);
    }

    function deleteItem(button) {
      const id = button.dataset.id;
      const categoryId = button.closest(".category")?.dataset.category;
      const customCountBefore = customItems.length;

      customItems = customItems.filter((item) => item.id !== id);
      if (customItems.length !== customCountBefore) {
        saveCustomItems();
      } else {
        deletedItems.add(id);
        saveDeletedItems();
      }

      checkedItems.delete(id);
      delete itemEdits[id];
      saveChecked();
      saveItemEdits();
      render({ anchorCategoryId: categoryId });
    }

    function findCategory(categoryId) {
      return allCategories().find((category) => category.id === categoryId);
    }

    function findItem(itemId) {
      return allCategories()
        .flatMap((category) => category.items.map((item) => ({ ...item, categoryId: category.id })))
        .find((item) => item.id === itemId);
    }

    function editCategory(button) {
      const categoryId = button.dataset.categoryId;
      const category = findCategory(categoryId);
      if (!category) return;

      openEditor({
        type: "category",
        id: categoryId,
        eyebrow: "카테고리",
        title: "카테고리 수정",
        copy: "입고 갈 옷, 침례복, 잠옷 같은 큰 묶음 이름을 바꿉니다.",
        name: category.title,
        showName: true,
        showNote: false,
        submitLabel: "저장"
      });
    }

    function deleteCategory(button) {
      const categoryId = button.dataset.categoryId;
      const category = findCategory(categoryId);
      if (!category) return;

      openEditor({
        type: "delete-category",
        id: categoryId,
        eyebrow: "삭제 확인",
        title: `${category.title} 삭제`,
        copy: "이 카테고리와 안의 준비물이 화면에서 숨겨집니다.",
        showName: false,
        showNote: false,
        submitLabel: "삭제"
      });
    }

    function editItem(button) {
      const id = button.dataset.id;
      const item = findItem(id);
      if (!item) return;

      openEditor({
        type: "item",
        id,
        eyebrow: "준비물",
        title: "준비물 수정",
        copy: "이름과 짧은 메모를 바꿀 수 있습니다.",
        name: item.name,
        note: item.note || "",
        showName: true,
        showNote: true,
        submitLabel: "저장"
      });
    }

    function openEditor(state) {
      editorState = state;
      editEyebrow.textContent = state.eyebrow;
      editTitle.textContent = state.title;
      editCopy.textContent = state.copy || "";
      editSaveBtn.textContent = state.submitLabel || "저장";
      editSaveBtn.style.background = state.type === "delete-category" ? "var(--coral)" : "var(--blue)";
      editSaveBtn.style.borderColor = state.type === "delete-category" ? "var(--coral)" : "var(--blue)";

      editNameField.hidden = state.showName === false;
      editNameInput.required = state.showName !== false;
      editNameInput.value = state.name || "";

      editNoteField.hidden = state.showNote !== true;
      editNoteInput.value = state.note || "";

      editDialog.hidden = false;
      window.setTimeout(() => {
        if (state.showName !== false) {
          editNameInput.focus();
          editNameInput.select();
        } else {
          editSaveBtn.focus();
        }
      }, 0);
    }

    function closeEditor() {
      editDialog.hidden = true;
      editorState = null;
      editForm.reset();
    }

    function saveEditor(event) {
      event.preventDefault();
      if (!editorState) return;

      if (editorState.type === "category") {
        const title = editNameInput.value.trim();
        if (!title) return;

        categoryEdits[editorState.id] = {
          ...(categoryEdits[editorState.id] || {}),
          title,
          deleted: false
        };
        saveCategoryEdits();
        render({ anchorCategoryId: editorState.id });
        closeEditor();
        return;
      }

      if (editorState.type === "delete-category") {
        const category = findCategory(editorState.id);
        if (category) {
          category.items.forEach((item) => {
            checkedItems.delete(item.id);
            deletedItems.delete(item.id);
          });
        }

        categoryEdits[editorState.id] = {
          ...(categoryEdits[editorState.id] || {}),
          deleted: true
        };
        expandedCategories.delete(editorState.id);
        openAddPanels.delete(editorState.id);
        categoryOrder = categoryOrder.filter((id) => id !== editorState.id);

        saveChecked();
        saveDeletedItems();
        saveCategoryEdits();
        saveExpandedCategories();
        saveOpenAddPanels();
        saveCategoryOrder();
        render();
        closeEditor();
        return;
      }

      if (editorState.type !== "item") return;

      const id = editorState.id;
      const categoryId = findItem(id)?.categoryId;
      const name = editNameInput.value.trim();
      if (!name) return;

      const note = editNoteInput.value.trim();
      const customItem = customItems.find((entry) => entry.id === id);

      if (customItem) {
        customItem.name = name;
        if (note) {
          customItem.note = note;
        } else {
          delete customItem.note;
        }
        saveCustomItems();
      } else {
        itemEdits[id] = { name, note };
        saveItemEdits();
      }

      render({ anchorCategoryId: categoryId });
      closeEditor();
    }

    function showBurst(button) {
      const burst = document.createElement("span");
      burst.className = "burst";
      button.appendChild(burst);
      window.setTimeout(() => burst.remove(), 540);
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll(".filter-btn").forEach((button) => {
        button.classList.toggle("is-active", button.dataset.filter === filter);
      });
      render();
    }

    function addCategory(event) {
      event.preventDefault();

      const title = categoryNameInput.value.trim();
      if (!title) {
        categoryNameInput.focus();
        return;
      }

      const id = `category-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      const mark = String(categories.length + customCategories.length + 1).padStart(2, "0");

      customCategories.push({ id, title, mark, items: [] });
      categoryOrder = allCategories().map((category) => category.id);
      expandedCategories.add(id);
      openAddPanels.add(id);
      saveCustomCategories();
      saveCategoryOrder();
      saveExpandedCategories();
      saveOpenAddPanels();
      categoryNameInput.value = "";
      render({ preserveScroll: true });

      const addedCategory = board.querySelector(`[data-category="${CSS.escape(id)}"]`);
      if (addedCategory) {
        addedCategory.scrollIntoView({ behavior: "smooth", block: "center" });
        window.setTimeout(() => {
          const input = addedCategory.querySelector(".category-item-input");
          if (input) input.focus({ preventScroll: true });
        }, 320);
      }
    }

    function addCategoryItem(event) {
      event.preventDefault();

      const form = event.target.closest(".category-item-form");
      if (!form) return;

      const input = form.querySelector(".category-item-input");
      const noteInput = form.querySelector(".category-item-note-input");
      const value = input.value.trim();
      if (!value) {
        input.focus();
        return;
      }

      const categoryId = form.dataset.categoryId;
      const id = `custom-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      const note = noteInput ? noteInput.value.trim() : "";

      customItems.push({
        id,
        categoryId,
        name: value,
        ...(note ? { note } : {})
      });
      saveCustomItems();
      itemDrafts[categoryId] = { name: "", note: "" };
      expandedCategories.add(categoryId);
      openAddPanels.add(categoryId);
      saveExpandedCategories();
      saveOpenAddPanels();
      render({
        anchorCategoryId: categoryId,
        focusCategoryId: categoryId,
        highlightItemId: id
      });
    }

    function resetChecks() {
      if (!window.confirm("체크 표시만 모두 초기화할까요? 추가하거나 수정한 내용은 그대로 남습니다.")) return;
      checkedItems = new Set();
      saveChecked();
      dataMenu.open = false;
      render();
    }

    function setReorderMode(enabled) {
      isReorderMode = enabled;
      reorderBtn.classList.toggle("is-active", enabled);
      reorderBtn.setAttribute("aria-pressed", String(enabled));
      reorderLabel.textContent = enabled ? "순서 완료" : "순서 변경";
      reorderBtn.querySelector(".action-icon").textContent = enabled ? "✓" : "↕";
      toggleAllBtn.disabled = enabled;
      dataMenu.open = false;
      render();
    }

    function moveCategory(categoryId, direction, sourceButton) {
      const ids = allCategories().map((category) => category.id);
      const currentIndex = ids.indexOf(categoryId);
      const nextIndex = currentIndex + direction;
      if (currentIndex < 0 || nextIndex < 0 || nextIndex >= ids.length) return;

      [ids[currentIndex], ids[nextIndex]] = [ids[nextIndex], ids[currentIndex]];
      categoryOrder = ids;
      saveCategoryOrder();
      render({ anchorCategoryId: categoryId });

      const card = board.querySelector(`[data-category="${CSS.escape(categoryId)}"]`);
      if (!card) return;
      card.classList.add("just-moved");
      window.setTimeout(() => card.classList.remove("just-moved"), 540);
      const selector = sourceButton?.classList.contains("category-move-up")
        ? ".category-move-up"
        : ".category-move-down";
      card.querySelector(selector)?.focus({ preventScroll: true });
    }

    function updateRenderedOrderState() {
      const cards = [...board.querySelectorAll(".category")];
      cards.forEach((card, index) => {
        const mark = card.querySelector(".category-mark");
        const up = card.querySelector(".category-move-up");
        const down = card.querySelector(".category-move-down");
        if (mark) mark.textContent = String(index + 1).padStart(2, "0");
        if (up) up.disabled = index === 0;
        if (down) down.disabled = index === cards.length - 1;
      });
    }

    function startCategoryDrag(event, handle) {
      if (!isReorderMode || event.button > 0 || dragState) return;
      const card = handle.closest(".category");
      if (!card) return;

      const pendingDrag = {
        pointerId: event.pointerId,
        card,
        handle,
        startX: event.clientX,
        startY: event.clientY,
        activated: false,
        cancelled: false,
        moved: false
      };
      dragState = pendingDrag;
      handle.classList.add("is-pressing");
      pendingDrag.timer = window.setTimeout(() => {
        if (dragState !== pendingDrag || pendingDrag.cancelled) return;
        pendingDrag.activated = true;
        pendingDrag.card.classList.add("is-dragging");
        pendingDrag.handle.classList.remove("is-pressing");
        pendingDrag.handle.classList.add("is-active");
        if (navigator.vibrate) navigator.vibrate(18);
      }, DRAG_HOLD_MS);
      handle.setPointerCapture?.(event.pointerId);
      event.preventDefault();
    }

    function moveCategoryDrag(event) {
      if (!dragState || event.pointerId !== dragState.pointerId) return;
      const distance = Math.hypot(event.clientX - dragState.startX, event.clientY - dragState.startY);
      if (!dragState.activated) {
        if (distance > 12) {
          dragState.cancelled = true;
          window.clearTimeout(dragState.timer);
          dragState.handle.classList.remove("is-pressing");
        }
        return;
      }
      if (distance < 5 && !dragState.moved) return;
      dragState.moved = true;

      if (event.clientY < 90) window.scrollBy(0, -14);
      if (event.clientY > window.innerHeight - 90) window.scrollBy(0, 14);

      const target = document.elementFromPoint(event.clientX, event.clientY)?.closest(".category");
      if (!target || target === dragState.card || target.parentElement !== board) return;
      const targetRect = target.getBoundingClientRect();
      const placeAfter = event.clientY > targetRect.top + targetRect.height / 2;
      board.insertBefore(dragState.card, placeAfter ? target.nextSibling : target);
      updateRenderedOrderState();
      event.preventDefault();
    }

    function endCategoryDrag(event) {
      if (!dragState || event.pointerId !== dragState.pointerId) return;
      const { card, handle, moved, activated, timer } = dragState;
      window.clearTimeout(timer);
      try {
        handle.releasePointerCapture?.(event.pointerId);
      } catch {}
      card.classList.remove("is-dragging");
      handle.classList.remove("is-pressing", "is-active");
      dragState = null;

      if (!activated || !moved) return;
      categoryOrder = [...board.querySelectorAll(".category")].map((entry) => entry.dataset.category);
      saveCategoryOrder();
      card.classList.add("just-moved");
      window.setTimeout(() => card.classList.remove("just-moved"), 540);
    }

    function makeBackupPayload() {
      const data = {};
      DATA_KEYS.forEach((key) => {
        const value = localStorage.getItem(key);
        if (value !== null) data[key] = value;
      });
      return {
        app: "하계수양회 준비물 체크리스트",
        version: 1,
        exportedAt: new Date().toISOString(),
        data
      };
    }

    function exportBackup() {
      const blob = new Blob([JSON.stringify(makeBackupPayload(), null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "하계수양회-준비물-백업.json";
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      dataMenu.open = false;
    }

    function applyBackupData(data) {
      DATA_KEYS.forEach((key) => localStorage.removeItem(key));
      DATA_KEYS.forEach((key) => {
        if (typeof data[key] === "string") localStorage.setItem(key, data[key]);
      });
      window.location.reload();
    }

    async function importBackup(event) {
      const file = event.target.files?.[0];
      event.target.value = "";
      if (!file) return;

      try {
        const payload = JSON.parse(await file.text());
        if (!payload || payload.app !== "하계수양회 준비물 체크리스트" || typeof payload.data !== "object") {
          throw new Error("invalid-backup");
        }
        if (!window.confirm("현재 내용을 선택한 백업 내용으로 바꿀까요?")) return;
        applyBackupData(payload.data);
      } catch {
        window.alert("이 앱에서 만든 백업 파일을 선택해 주세요.");
      }
    }

    function restoreAutomaticBackup() {
      try {
        const payload = JSON.parse(localStorage.getItem(AUTO_BACKUP_KEY) || "null");
        if (!payload?.data) throw new Error("missing-backup");
        if (!window.confirm("기능을 바꾸기 전 자동 백업으로 되돌릴까요?")) return;
        applyBackupData(payload.data);
      } catch {
        window.alert("복원할 자동 백업이 없습니다.");
      }
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    board.addEventListener("click", (event) => {
      const moveUpButton = event.target.closest(".category-move-up");
      if (moveUpButton) {
        moveCategory(moveUpButton.dataset.categoryId, -1, moveUpButton);
        return;
      }

      const moveDownButton = event.target.closest(".category-move-down");
      if (moveDownButton) {
        moveCategory(moveDownButton.dataset.categoryId, 1, moveDownButton);
        return;
      }

      if (event.target.closest(".category-drag-handle")) return;

      const categoryToggle = event.target.closest(".category-toggle");
      if (categoryToggle) {
        toggleCategory(categoryToggle);
        return;
      }

      const categoryEditButton = event.target.closest(".category-edit-btn");
      if (categoryEditButton) {
        editCategory(categoryEditButton);
        return;
      }

      const categoryDeleteButton = event.target.closest(".category-delete-btn");
      if (categoryDeleteButton) {
        deleteCategory(categoryDeleteButton);
        return;
      }

      const editButton = event.target.closest(".edit-btn");
      if (editButton) {
        editItem(editButton);
        return;
      }

      const deleteButton = event.target.closest(".delete-btn");
      if (deleteButton) {
        deleteItem(deleteButton);
        return;
      }

      const button = event.target.closest(".item-main");
      if (button) toggleItem(button);

      const addToggle = event.target.closest(".category-add-toggle");
      if (addToggle) {
        window.setTimeout(() => {
          const panel = addToggle.closest(".category-add-panel");
          const categoryId = addToggle.dataset.categoryId;
          if (panel?.open) {
            openAddPanels.add(categoryId);
          } else {
            openAddPanels.delete(categoryId);
          }
          saveOpenAddPanels();
        }, 0);
      }
    });

    board.addEventListener("input", (event) => {
      const input = event.target.closest(".category-item-input, .category-item-note-input");
      if (!input) return;
      const form = input.closest(".category-item-form");
      if (!form) return;
      itemDrafts[form.dataset.categoryId] = {
        name: form.querySelector(".category-item-input")?.value || "",
        note: form.querySelector(".category-item-note-input")?.value || ""
      };
    });

    board.addEventListener("pointerdown", (event) => {
      const handle = event.target.closest(".category-drag-handle");
      if (handle) startCategoryDrag(event, handle);
    });

    board.addEventListener("contextmenu", (event) => {
      if (event.target.closest(".category-drag-handle")) event.preventDefault();
    });

    window.addEventListener("pointermove", moveCategoryDrag, { passive: false });
    window.addEventListener("pointerup", endCategoryDrag);
    window.addEventListener("pointercancel", endCategoryDrag);

    board.addEventListener("submit", (event) => {
      if (event.target.matches(".category-item-form")) {
        addCategoryItem(event);
      }
    });

    document.querySelectorAll(".filter-btn").forEach((button) => {
      button.addEventListener("click", () => setFilter(button.dataset.filter));
    });

    toggleAllBtn.addEventListener("click", toggleAllCategories);
    reorderBtn.addEventListener("click", () => setReorderMode(!isReorderMode));
    exportBtn.addEventListener("click", exportBackup);
    importBtn.addEventListener("click", () => importFileInput.click());
    importFileInput.addEventListener("change", importBackup);
    restoreAutoBackupBtn.addEventListener("click", restoreAutomaticBackup);
    resetBtn.addEventListener("click", resetChecks);
    categoryAddForm.addEventListener("submit", addCategory);
    editForm.addEventListener("submit", saveEditor);
    editCancelBtn.addEventListener("click", closeEditor);
    editDialog.addEventListener("click", (event) => {
      if (event.target.matches("[data-close-editor]")) closeEditor();
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !editDialog.hidden) closeEditor();
    });

    document.addEventListener("click", (event) => {
      if (dataMenu.open && !event.target.closest("#dataMenu")) dataMenu.open = false;
    });

    render();

    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
